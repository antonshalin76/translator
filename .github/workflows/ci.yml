name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: translator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Attach exact checked-out candidate
        run: git switch --create ci-validation-candidate

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            protobuf-compiler \
            unzip

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default 1.88.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned validation tools
        env:
          CARGO_AUDIT_VERSION: "0.22.2"
          CARGO_AUDIT_ARCHIVE_SHA256: "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39"
          CARGO_AUDIT_EXECUTABLE_SHA256: "473b9a71e5cb5bde22f69c32f749c9b83931287d92dc36b91cb04f6705640ef2"
          UV_VERSION: "0.12.9"
          UV_ARCHIVE_SHA256: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
          UV_EXECUTABLE_SHA256: "671793498fe0a545432e2524b6691ffb9eea4540d9fda43ca2f978df2dbf8426"
          BUN_VERSION: "1.3.12"
          BUN_ARCHIVE_SHA256: "11dc3ee11bc1695e149737c6ca3d5619302cf4346e6b8a6ec7988967ef01ddc5"
          BUN_EXECUTABLE_SHA256: "92a1cd8b6185f676010bb18e767dfc65c772273e79ae9984480843261939eeaa"
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          OSV_SCANNER_VERSION: "2.5.0"
          OSV_SCANNER_SHA256: "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
        run: |
          translator_tools_dir="${RUNNER_TEMP}/translator-tools"
          install -d -m 0755 "${translator_tools_dir}"

          cargo_audit_archive="${RUNNER_TEMP}/cargo-audit.tgz"
          curl --fail --location --silent --show-error \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz" \
            --output "${cargo_audit_archive}"
          printf '%s  %s\n' "${CARGO_AUDIT_ARCHIVE_SHA256}" "${cargo_audit_archive}" | \
            sha256sum --check
          tar -xzf "${cargo_audit_archive}" --strip-components=1 \
            -C "${translator_tools_dir}" \
            "cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}/cargo-audit"
          printf '%s  %s\n' "${CARGO_AUDIT_EXECUTABLE_SHA256}" \
            "${translator_tools_dir}/cargo-audit" | sha256sum --check
          chmod 0755 "${translator_tools_dir}/cargo-audit"

          uv_archive="${RUNNER_TEMP}/uv.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            --output "${uv_archive}"
          printf '%s  %s\n' "${UV_ARCHIVE_SHA256}" "${uv_archive}" | \
            sha256sum --check
          tar -xzf "${uv_archive}" --strip-components=1 \
            -C "${translator_tools_dir}" \
            "uv-x86_64-unknown-linux-gnu/uv"
          printf '%s  %s\n' "${UV_EXECUTABLE_SHA256}" \
            "${translator_tools_dir}/uv" | sha256sum --check
          chmod 0755 "${translator_tools_dir}/uv"

          bun_archive="${RUNNER_TEMP}/bun.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" \
            --output "${bun_archive}"
          printf '%s  %s\n' "${BUN_ARCHIVE_SHA256}" "${bun_archive}" | \
            sha256sum --check
          unzip -p "${bun_archive}" bun-linux-x64/bun >"${translator_tools_dir}/bun"
          printf '%s  %s\n' "${BUN_EXECUTABLE_SHA256}" \
            "${translator_tools_dir}/bun" | sha256sum --check
          chmod 0755 "${translator_tools_dir}/bun"

          gitleaks_archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${gitleaks_archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${gitleaks_archive}" | \
            sha256sum --check
          tar -xzf "${gitleaks_archive}" -C "${translator_tools_dir}" gitleaks
          chmod 0755 "${translator_tools_dir}/gitleaks"

          osv_scanner="${translator_tools_dir}/osv-scanner"
          curl --fail --location --silent --show-error \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            --output "${osv_scanner}"
          printf '%s  %s\n' "${OSV_SCANNER_SHA256}" "${osv_scanner}" | \
            sha256sum --check
          chmod 0755 "${osv_scanner}"

          shellcheck_archive="${RUNNER_TEMP}/shellcheck.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" \
            --output "${shellcheck_archive}"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${shellcheck_archive}" | \
            sha256sum --check
          tar -xzf "${shellcheck_archive}" --strip-components=1 \
            -C "${translator_tools_dir}" \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod 0755 "${translator_tools_dir}/shellcheck"

          printf '%s\n' "${translator_tools_dir}" >>"${GITHUB_PATH}"

      - name: Run deterministic repository contract
        run: ./scripts/translator-validate deterministic
