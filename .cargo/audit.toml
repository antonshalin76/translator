[advisories]
# Metadata and the 2026-12-01 expiry for every temporary exception are enforced
# by config/osv-scanner.toml. The mandatory OSV scan covers this same lockfile.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]
severity_threshold = "low"

[output]
deny = ["warnings"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
