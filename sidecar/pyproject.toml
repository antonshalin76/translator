[project]
name = "translator-sidecar"
version = "0.1.0"
authors = [
    { name = "Anton Shalin", email = "anton.shalin@gmail.com" },
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctranslate2==4.7.1",
    "faster-whisper==1.2.1",
    "grpcio>=1.83.0",
    "jiwer>=4,<5",
    "numpy==2.4.4",
    "piper-tts==1.4.2",
    "psutil==7.2.2",
    "pydantic>=2.11,<3",
    "sacrebleu>=2.5,<3",
    "sentencepiece==0.2.1",
    "soxr==1.0.0",
    "websocket-client>=1.9,<2",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
