[project]
name = "translator-sidecar"
version = "0.1.0"
authors = [
    { name = "Anton Shalin", email = "anton.shalin@gmail.com" },
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctranslate2==4.7.1",
    "faster-whisper==1.2.1",
    "grpcio>=1.83.0",
    "jiwer>=4,<5",
    "numpy==2.4.4",
    "piper-tts==1.4.2",
    "psutil==7.2.2",
    "pydantic>=2.11,<3",
    "sacrebleu>=2.5,<3",
    "sentencepiece==0.2.1",
    "soxr==1.0.0",
    "websocket-client>=1.9,<2",
    "websockets==17.0.1",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "grpcio-tools>=1.83.0",
    "pytest>=9.0.3,<10",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Stable correctness, modernization, import, and bug-risk rules. Generated
# protobuf bindings are validated by protoc and are not hand-maintained Python.
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/translator_sidecar/generated/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["translator_sidecar"]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally contain Cyrillic translation fixtures and Unicode
# punctuation that the normalization logic must preserve verbatim.
"**/translator_sidecar/benchmark/task6.py" = ["RUF001"]
"**/translator_sidecar/local/mt.py" = ["RUF001"]
"**/translator_sidecar/local/tts.py" = ["RUF001"]
"**/tests/test_local_mt.py" = ["RUF001"]
"**/tests/test_task6_benchmark.py" = ["RUF001"]
# Wire enums retain their established `str, Enum` stringification contract.
"**/translator_sidecar/benchmark/task7.py" = ["UP042"]
"**/translator_sidecar/local/local_provider.py" = ["UP042"]
"**/translator_sidecar/local/source_commit.py" = ["UP042"]
"**/translator_sidecar/provider_contract.py" = ["UP042"]

[tool.ruff.format]
docstring-code-format = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
