[workspace]
members = [
    "apps/translator-ui/src-tauri",
    "crates/translator-audio",
    "crates/translator-core",
    "crates/translator-daemon",
    "crates/translator-ipc",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Anton Shalin <anton.shalin@gmail.com>"]

[workspace.dependencies]
axum = { version = "0.8.4", features = ["json", "http1", "tokio"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
fs4 = "1.1"
futures-util = "0.3"
getrandom = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
prost = "0.14.4"
rustix = { version = "1.1", features = ["fs", "net", "process", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
wait-timeout = "=0.2.1"
